[project]
name = "roompulse-transcription"
version = "0.1.0"
description = "Local real-time transcription and speaker clustering service for RoomPulse."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "faster-whisper>=1.1.0",
  "numpy>=1.26.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
speaker = [
  "pyannote.audio>=3.3.0",
  "resemblyzer>=0.1.4",
  "speechbrain>=1.0.0",
  "webrtcvad>=2.0.10",
]
speaker-nemo = [
  "nemo_toolkit[asr]>=2.0.0",
]

[tool.uv]
package = false
